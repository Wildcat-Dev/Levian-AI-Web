<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levian AI</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEMING
           ========================================================================== */
        :root {
            /* Dark Theme (Default) */
            --bg-main: #0d0e12;
            --bg-sidebar: #13151c;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --bg-card-active: rgba(255, 255, 255, 0.12);
            --bg-input: #1a1d26;
            --bg-modal: #161822;
            --bg-code: #0b0c10;
            
            --text-primary: #f0f2f5;
            --text-secondary: #9da3b4;
            --text-muted: #62687a;
            
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.18);
            
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.25);
            
            --user-msg-bg: #1e2638;
            --user-msg-border: rgba(59, 130, 246, 0.2);
            --ai-msg-bg: transparent;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-main: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-card-hover: rgba(0, 0, 0, 0.07);
            --bg-card-active: rgba(0, 0, 0, 0.12);
            --bg-input: #ffffff;
            --bg-modal: #ffffff;
            --bg-code: #1e293b;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --border-color: rgba(0, 0, 0, 0.08);
            --border-highlight: rgba(0, 0, 0, 0.18);
            
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.15);
            
            --user-msg-bg: #e0e7ff;
            --user-msg-border: rgba(37, 99, 235, 0.2);
            --ai-msg-bg: transparent;
        }

        /* ==========================================================================
           2. BASE RESETS & LAYOUT
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ==========================================================================
           3. SIDEBAR STYLING
           ========================================================================== */
        #sidebar {
            width: 280px;
            height: 100%;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform var(--transition-normal), background-color var(--transition-normal);
        }

        .sidebar-header {
            padding: 18px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .brand-badge {
            font-size: 0.65rem;
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-new-chat {
            width: 100%;
            padding: 10px 14px;
            margin: 12px 0 4px 0;
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background var(--transition-fast), transform var(--transition-fast);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-new-chat:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: background var(--transition-fast), color var(--transition-fast);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .history-item.active {
            background: var(--bg-card-active);
            color: var(--text-primary);
            border-color: var(--border-color);
            font-weight: 500;
        }

        .history-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .history-item-del {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 4px;
            border-radius: var(--radius-sm);
            transition: opacity var(--transition-fast), color var(--transition-fast);
        }

        .history-item:hover .history-item-del {
            opacity: 1;
        }

        .history-item-del:hover {
            color: #ef4444;
        }

        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--bg-sidebar);
        }

        .glass-btn {
            width: 100%;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 9px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background var(--transition-fast), border-color var(--transition-fast);
        }

        .glass-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-highlight);
        }

        .icon-img {
            width: 16px;
            height: 16px;
            object-fit: contain;
            display: block;
        }

        /* ==========================================================================
           4. MAIN CONTENT & STREAM AREA
           ========================================================================== */
        #main-content {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-main);
        }

        #top-header {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-main);
            z-index: 5;
        }

        .chat-title-display {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        #stream {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        @media (max-width: 1024px) {
            #stream {
                padding: 20px 8%;
            }
        }

        @media (max-width: 640px) {
            #sidebar {
                position: absolute;
                left: -280px;
            }
            #sidebar.open {
                transform: translateX(280px);
            }
            #stream {
                padding: 16px;
            }
        }

        /* ==========================================================================
           5. MESSAGE BUBBLES & TYPOGRAPHY
           ========================================================================== */
        .message {
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            max-width: 88%;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--user-msg-bg);
            border: 1px solid var(--user-msg-border);
            align-self: flex-end;
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--ai-msg-bg);
            align-self: flex-start;
            color: var(--text-primary);
            width: 100%;
            max-width: 100%;
            padding-left: 0;
            padding-right: 0;
        }

        /* Markdown Formatting inside AI Messages */
        .ai-message p {
            margin-bottom: 12px;
        }
        .ai-message p:last-child {
            margin-bottom: 0;
        }

        .ai-message h1, .ai-message h2, .ai-message h3, .ai-message h4 {
            margin: 16px 0 8px 0;
            font-weight: 700;
            color: var(--text-primary);
        }

        .ai-message ul, .ai-message ol {
            margin: 8px 0 12px 24px;
        }

        .ai-message li {
            margin-bottom: 4px;
        }

        .ai-message blockquote {
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
            margin: 12px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Code Blocks */
        .code-block-wrapper {
            background-color: var(--bg-code);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin: 14px 0;
            overflow: hidden;
        }

        .code-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-family: monospace;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            transition: background var(--transition-fast);
        }

        .copy-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .ai-message pre {
            padding: 12px;
            overflow-x: auto;
            font-family: "Fira Code", Monaco, Consolas, "Courier New", monospace;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #e2e8f0;
        }

        .inline-code {
            background-color: var(--bg-card-active);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.88em;
            color: var(--accent-color);
        }

        /* Typing Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--accent-color);
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 1px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==========================================================================
           6. INPUT AREA STYLING
           ========================================================================== */
        #input-container {
            padding: 16px 20%;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background-color: var(--bg-main);
            align-items: flex-end;
            position: relative;
        }

        @media (max-width: 1024px) {
            #input-container {
                padding: 14px 8%;
            }
        }

        @media (max-width: 640px) {
            #input-container {
                padding: 12px;
            }
        }

        .input-box-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px 12px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-box-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea {
            width: 100%;
            background: transparent;
            color: var(--text-primary);
            border: none;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 160px;
            font-size: 0.95rem;
            line-height: 1.4;
            padding: 6px 0;
        }

        .input-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 6px;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
        }

        select#modelSelect {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        select#modelSelect:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .send-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background var(--transition-fast), opacity var(--transition-fast);
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==========================================================================
           7. SETTINGS MODAL STYLING
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-modal);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 480px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(10px);
            transition: transform var(--transition-normal);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color var(--transition-fast);
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .setting-input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            outline: none;
            font-size: 0.88rem;
        }

        .setting-input:focus {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="brand-title">
                Levian AI
                <span class="brand-badge">PRO</span>
            </div>
        </div>

        <div style="padding: 0 12px;">
            <button class="btn-new-chat" onclick="startNewChat()">
                <span>+</span> New Chat
            </button>
        </div>

        <div id="chat-history">
            <!-- Dynamic chat history list -->
        </div>

        <div class="sidebar-footer">
            <!-- Theme Toggle Button -->
            <button class="glass-btn" onclick="toggleTheme()">
                <span id="theme-icon">🌗</span> Toggle Theme
            </button>

            <!-- Export Chat Button -->
            <button class="glass-btn" onclick="exportCurrentChat()">
                📥 Export Current Chat
            </button>

            <!-- Settings Button with Custom Dynamic Image Icon -->
            <button class="glass-btn" onclick="openSettings()">
                <img id="settings-icon" class="icon-img" src="settingsw.png" alt="Settings"> 
                Settings
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <div id="top-header">
            <span class="chat-title-display" id="headerChatTitle">New Conversation</span>
        </div>

        <!-- STREAM / CHAT AREA -->
        <div id="stream"></div>

        <!-- INPUT CONTAINER -->
        <div id="input-container">
            <div class="input-box-wrapper">
                <textarea id="userInput" placeholder="Message Levian AI..." onkeypress="handleEnter(event)" oninput="autoResizeTextarea(this)"></textarea>
                
                <div class="input-controls">
                    <!-- Model selector (2.5 pro explicitly removed) -->
                    <select id="modelSelect">
                        <option value="gemini-3.1-flash-lite">3.1 flash-lite</option>
                        <option value="gemini-3.5-flash" selected>3.5 flash</option>
                    </select>

                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Settings</span>
                <button class="close-btn" onclick="closeSettings()">&times;</button>
            </div>
            
            <div class="setting-row">
                <label class="setting-label">System Instruction Override</label>
                <input type="text" id="sysPromptInput" class="setting-input" placeholder="e.g. You are a helpful technical assistant...">
            </div>

            <div class="setting-row">
                <label class="setting-label">Worker Endpoint URL</label>
                <input type="text" id="workerUrlInput" class="setting-input" value="https://levianai.qzz.io/levian">
            </div>

            <button class="glass-btn" style="background: var(--accent-color); color: white; border: none; margin-top: 8px;" onclick="saveSettings()">
                Save & Close
            </button>
        </div>
    </div>

    <!-- APPLICATION SCRIPT -->
    <script>
        /* ==========================================================================
           STATE & GLOBAL VARIABLES
           ========================================================================== */
        let workerUrl = "https://levianai.qzz.io/levian";
        let systemPrompt = "";
        
        const stream = document.getElementById("stream");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const historyContainer = document.getElementById("chat-history");
        const headerChatTitle = document.getElementById("headerChatTitle");

        let chats = {}; // Structure: { chatId: { title: "...", messages: [...] } }
        let currentChatId = null;
        let isFirstMessage = true;

        /* ==========================================================================
           1. INITIALIZATION & STORAGE
           ========================================================================== */
        function init() {
            // Load theme
            const savedTheme = localStorage.getItem("levian_theme") || "dark";
            document.body.setAttribute("data-theme", savedTheme);
            updateSettingsIcon(savedTheme === "dark");

            // Load saved settings
            const savedWorker = localStorage.getItem("levian_worker_url");
            if (savedWorker) {
                workerUrl = savedWorker;
                document.getElementById("workerUrlInput").value = savedWorker;
            }
            systemPrompt = localStorage.getItem("levian_sys_prompt") || "";
            document.getElementById("sysPromptInput").value = systemPrompt;

            // Load chats from LocalStorage
            const storedChats = localStorage.getItem("levian_chats");
            if (storedChats) {
                try {
                    chats = JSON.parse(storedChats);
                } catch(e) {
                    chats = {};
                }
            }

            renderSidebarHistory();

            // Start new chat if no history exists
            const chatIds = Object.keys(chats);
            if (chatIds.length > 0) {
                loadChat(chatIds[chatIds.length - 1]);
            } else {
                startNewChat();
            }
        }

        function saveState() {
            localStorage.setItem("levian_chats", JSON.stringify(chats));
        }

        /* ==========================================================================
           2. THEME & SETTINGS LOGIC
           ========================================================================== */
        function toggleTheme() {
            const currentTheme = document.body.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.body.setAttribute("data-theme", newTheme);
            localStorage.setItem("levian_theme", newTheme);
            updateSettingsIcon(newTheme === "dark");
        }

        function updateSettingsIcon(isDarkMode) {
            const icon = document.getElementById("settings-icon");
            if (isDarkMode) {
                icon.src = "settingsw.png"; // White icon for dark theme
            } else {
                icon.src = "settingsb.png"; // Black icon for light theme
            }
        }

        function openSettings() {
            document.getElementById("settingsModal").classList.add("active");
        }

        function closeSettings() {
            document.getElementById("settingsModal").classList.remove("active");
        }

        function saveSettings() {
            workerUrl = document.getElementById("workerUrlInput").value.trim();
            systemPrompt = document.getElementById("sysPromptInput").value.trim();
            
            localStorage.setItem("levian_worker_url", workerUrl);
            localStorage.setItem("levian_sys_prompt", systemPrompt);
            closeSettings();
        }

        /* ==========================================================================
           3. CHAT MANAGEMENT & HISTORY
           ========================================================================== */
        function startNewChat() {
            currentChatId = "chat_" + Date.now();
            chats[currentChatId] = {
                title: "New Conversation",
                messages: []
            };
            isFirstMessage = true;
            stream.innerHTML = "";
            headerChatTitle.innerText = "New Conversation";
            saveState();
            renderSidebarHistory();
        }

        function loadChat(chatId) {
            if (!chats[chatId]) return;
            currentChatId = chatId;
            isFirstMessage = chats[chatId].messages.length === 0;
            headerChatTitle.innerText = chats[chatId].title;
            stream.innerHTML = "";

            chats[chatId].messages.forEach(msg => {
                const bubble = appendMessageBubble(msg.text, msg.role === "user" ? "user-message" : "ai-message");
                if (msg.role === "model") {
                    bubble.innerHTML = parseMarkdown(msg.text);
                }
            });

            renderSidebarHistory();
            stream.scrollTop = stream.scrollHeight;
        }

        function deleteChat(e, chatId) {
            e.stopPropagation();
            delete chats[chatId];
            saveState();
            
            const remaining = Object.keys(chats);
            if (remaining.length > 0) {
                loadChat(remaining[remaining.length - 1]);
            } else {
                startNewChat();
            }
        }

        function renderSidebarHistory() {
            historyContainer.innerHTML = "";
            const keys = Object.keys(chats).reverse();

            keys.forEach(id => {
                const chat = chats[id];
                const item = document.createElement("div");
                item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(id);

                const titleSpan = document.createElement("span");
                titleSpan.className = "history-item-title";
                titleSpan.innerText = "💬 " + (chat.title || "New Conversation");

                const delBtn = document.createElement("button");
                delBtn.className = "history-item-del";
                delBtn.innerHTML = "&times;";
                delBtn.onclick = (e) => deleteChat(e, id);

                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                historyContainer.appendChild(item);
            });
        }

        function exportCurrentChat() {
            if (!currentChatId || !chats[currentChatId]) return;
            const chatData = chats[currentChatId];
            const blob = new Blob([JSON.stringify(chatData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${chatData.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /* ==========================================================================
           4. MESSAGING & API INTEGRATION
           ========================================================================== */
        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const selectedModel = document.getElementById("modelSelect").value;

            // UI Adjustments
            appendMessageBubble(text, "user-message");
            userInput.value = "";
            userInput.style.height = "auto";
            
            // Save user message to state
            chats[currentChatId].messages.push({ role: "user", text: text });
            saveState();

            // Handle title generation on first turn
            if (isFirstMessage) {
                generateSidebarTitle(text, selectedModel);
                isFirstMessage = false;
            }

            // Construct contents for Gemini API format
            let apiContents = chats[currentChatId].messages.map(m => ({
                role: m.role,
                parts: [{ text: m.text }]
            }));

            // Include system instruction if set
            if (systemPrompt) {
                apiContents.unshift({
                    role: "user",
                    parts: [{ text: `[System Instruction: ${systemPrompt}]` }]
                });
            }

            // Create AI response bubble placeholder with blinking cursor
            const aiBubble = appendMessageBubble("", "ai-message");
            const cursorBlock = document.createElement("span");
            cursorBlock.className = "cursor";
            aiBubble.appendChild(cursorBlock);

            sendBtn.disabled = true;

            try {
                const response = await fetch(`${workerUrl}?model=${selectedModel}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: apiContents })
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                // Save AI response to chat history
                chats[currentChatId].messages.push({ role: "model", text: aiText });
                saveState();

                // Trigger smooth typing output animation
                typeText(aiBubble, cursorBlock, aiText, 12);

            } catch (err) {
                console.error(err);
                aiBubble.innerText = "Error: Unable to process request. Please check worker endpoint.";
                if (cursorBlock) cursorBlock.remove();
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessageBubble(text, className) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.innerText = text;
            stream.appendChild(div);
            stream.scrollTop = stream.scrollHeight;
            return div;
        }

        /* ==========================================================================
           5. TYPING EFFECT & EXACT SMOOTH SCROLL LOGIC
           ========================================================================== */
        function typeText(element, cursorBlock, fullRawText, speed) {
            let i = 0;
            const printClock = setInterval(() => {
                // Periodically update innerHTML with rendered Markdown
                element.innerHTML = parseMarkdown(fullRawText.slice(0, i + 1));
                if (cursorBlock) element.appendChild(cursorBlock);
                i++;

                // EXACT USER SNIPPET: Smooth Scrolling Adjustment
                const userDistanceFromBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight;
                if (userDistanceFromBottom < 280) {
                    stream.scrollTop = stream.scrollHeight;
                }

                if (i >= fullRawText.length) {
                    clearInterval(printClock);
                    if (cursorBlock) cursorBlock.remove();
                    element.innerHTML = parseMarkdown(fullRawText); // Final complete render
                }
            }, speed);
        }

        /* ==========================================================================
           6. BACKGROUND TITLE GENERATION
           ========================================================================== */
        async function generateSidebarTitle(firstUserMessage, model) {
            // Strict prompt requesting ONLY short-term title
            const titlePrompt = `User message: "${firstUserMessage}"\n\nWhat should be the name of this conversation in short term title don't say anything else except the title`;

            try {
                const response = await fetch(`${workerUrl}?model=${model}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: titlePrompt }] }]
                    })
                });

                const data = await response.json();
                let generatedTitle = data.candidates[0].content.parts[0].text;

                // Clean up quotes and newlines
                generatedTitle = generatedTitle.replace(/^["']|["']$/g, '').replace(/\n/g, ' ').trim();

                // Update current chat title
                if (chats[currentChatId]) {
                    chats[currentChatId].title = generatedTitle;
                    headerChatTitle.innerText = generatedTitle;
                    saveState();
                    renderSidebarHistory();
                }

            } catch (error) {
                console.error("Failed to generate title:", error);
            }
        }

        /* ==========================================================================
           7. LIGHTWEIGHT MARKDOWN PARSER
           ========================================================================== */
        function parseMarkdown(text) {
            if (!text) return "";

            // Code Blocks ```lang ... ```
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                const safeCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div class="code-block-wrapper">
                    <div class="code-header">
                        <span>${lang || 'code'}</span>
                        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                    </div>
                    <pre><code>${safeCode}</code></pre>
                </div>`;
            });

            // Inline Code `code`
            text = text.replace(/`([^`]+)`/g, '<span class="inline-code">$1</span>');

            // Bold **text**
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Italic *text*
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Headers # ## ###
            text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // Bullet Lists
            text = text.replace(/^\s*-\s+(.*$)/gim, '<ul><li>$1</li></ul>');
            text = text.replace(/<\/ul>\n<ul>/g, ''); // Join contiguous list items

            // Line Breaks
            text = text.replace(/\n/g, '<br>');

            return text;
        }

        function copyCode(btn) {
            const pre = btn.parentElement.nextElementSibling;
            navigator.clipboard.writeText(pre.innerText).then(() => {
                btn.innerText = "Copied!";
                setTimeout(() => btn.innerText = "Copy", 2000);
            });
        }

        // Initialize on DOM Ready
        window.onload = init;
    </script>
</body>
