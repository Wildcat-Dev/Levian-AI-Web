<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levian AI | Synapse UI</title>
    <link rel="icon" type="image/png" href="LEVIANICON.png">
    
    <style>
        @font-face {
            font-family: 'Anurati';
            src: url('Anurati-Regular.otf') format('opentype');
        }

        /* Enforce uppercase for all Anurati styled text */
        .anurati-font, .brand-name, #beta-text {
            font-family: 'Anurati', sans-serif !important;
            text-transform: uppercase !important;
        }

        /* --- THEME VARIABLES --- */
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #00f3ff;
            --user-bubble: rgba(255, 255, 255, 0.05);
            --sidebar-width: 270px;
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.12);
            --glass-hover: rgba(0, 0, 0, 0.06);
            --text-main: #111111;
            --text-muted: #555555;
            --accent: #0078ff;
            --user-bubble: rgba(0, 0, 0, 0.05);
        }

        /* Midnight Blue Theme */
        [data-theme="blue"] {
            --bg-color: #020617;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(56, 189, 248, 0.2);
            --glass-hover: rgba(56, 189, 248, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --user-bubble: rgba(56, 189, 248, 0.1);
        }

        /* Cyberpunk Neon */
        [data-theme="cyberpunk"] {
            --bg-color: #0d021a;
            --glass-bg: rgba(25, 10, 45, 0.6);
            --glass-border: rgba(255, 0, 127, 0.25);
            --glass-hover: rgba(255, 0, 127, 0.15);
            --text-main: #ffffff;
            --text-muted: #b8860b;
            --accent: #ff007f;
            --user-bubble: rgba(255, 0, 127, 0.15);
        }

        /* Matrix Green */
        [data-theme="matrix"] {
            --bg-color: #020d04;
            --glass-bg: rgba(4, 25, 8, 0.6);
            --glass-border: rgba(0, 255, 102, 0.2);
            --glass-hover: rgba(0, 255, 102, 0.12);
            --text-main: #e0ffe8;
            --text-muted: #4e8056;
            --accent: #00ff66;
            --user-bubble: rgba(0, 255, 102, 0.1);
        }

        /* Sunset Amber */
        [data-theme="sunset"] {
            --bg-color: #120a05;
            --glass-bg: rgba(30, 15, 8, 0.6);
            --glass-border: rgba(255, 153, 0, 0.25);
            --glass-hover: rgba(255, 153, 0, 0.12);
            --text-main: #fff5eb;
            --text-muted: #a37f63;
            --accent: #ff9900;
            --user-bubble: rgba(255, 153, 0, 0.1);
        }

        /* Pure OLED Black */
        [data-theme="oled"] {
            --bg-color: #000000;
            --glass-bg: rgba(10, 10, 10, 0.9);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-hover: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #777777;
            --accent: #ffffff;
            --user-bubble: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            transition: background-color 0.4s ease;
        }

        /* --- GLASSMORPHISM UTILS --- */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: var(--sidebar-width);
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            z-index: 20;
            padding: 20px 15px;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        #top-left-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            opacity: 0.9;
        }

        .brand-name {
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* Buttons */
        .glass-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        .glass-btn:hover {
            background: var(--glass-hover);
            border-color: var(--accent);
            color: var(--accent);
        }
        .primary-btn { background: var(--glass-hover); border-color: var(--glass-border); }

        /* Chat History List */
        #history-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #history-list::-webkit-scrollbar { width: 4px; }
        #history-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            color: var(--text-muted);
            border: 1px solid transparent;
            overflow: hidden;
        }
        .history-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 80%;
        }
        .history-item:hover { background: var(--glass-hover); color: var(--text-main); }
        .history-item.active {
            background: var(--glass-hover);
            color: var(--text-main);
            border: 1px solid var(--accent);
        }

        .delete-btn {
            background: none; border: none; color: #ff4444; cursor: pointer;
            opacity: 0; transition: 0.2s; font-size: 15px;
        }
        .history-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { transform: scale(1.2); }

        /* Sidebar Footer */
        .sidebar-footer {
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- MAIN CHAT AREA --- */
        #main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Landing Sequence */
        #landing-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 5;
            pointer-events: none;
        }
        #beta-text {
            font-size: 14px; letter-spacing: 5px; color: var(--accent);
            opacity: 0.8; margin-bottom: 20px;
        }
        #hero-logo-center {
            width: 200px; height: 200px; object-fit: contain; margin-bottom: 20px;
        }
        #hero-text {
            font-size: 24px; font-weight: 300; letter-spacing: 1px; color: var(--text-muted);
        }
        body.chat-active #landing-ui {
            opacity: 0; transform: scale(0.95) translateY(-20px); pointer-events: none;
        }

        /* Chat Stream */
        #chat-stream {
            flex-grow: 1;
            padding: 40px 10%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.6s ease;
            padding-bottom: 150px;
        }
        body.chat-active #chat-stream { opacity: 1; }

        .msg-wrapper { display: flex; width: 100%; gap: 15px; align-items: flex-start; }
        .msg-wrapper.user-wrapper { justify-content: flex-end; }

        .ai-avatar {
            width: 35px; height: 35px; object-fit: contain; flex-shrink: 0;
        }
        .ai-avatar.thinking { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .msg {
            max-width: 75%; line-height: 1.6; font-size: 15px; padding: 14px 20px; 
            border-radius: 12px; word-wrap: break-word;
        }
        .msg.user {
            background: var(--user-bubble); border: 1px solid var(--glass-border);
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            background: transparent; color: var(--text-main); padding-left: 5px;
        }

        .typing-cursor {
            font-weight: bold; color: var(--accent); animation: blink 0.4s steps(2, start) infinite;
        }
        @keyframes blink { to { visibility: hidden; } }

        /* --- INPUT BAR --- */
        #input-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 800px;
            border-radius: 20px; padding: 10px 15px;
            display: flex; align-items: flex-end; gap: 10px; cursor: text;
            z-index: 100; transition: all 0.3s ease;
        }
        #input-container:focus-within { border-color: var(--accent); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }

        textarea {
            flex-grow: 1; background: transparent; border: none; outline: none;
            color: var(--text-main); font-family: inherit; font-size: 15px;
            resize: none; min-height: 24px; max-height: 120px; padding: 8px 0; overflow-y: auto;
        }
        textarea::placeholder { color: var(--text-muted); font-family: monospace; letter-spacing: 1px; }

        .controls { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }
        select {
            background: var(--glass-hover); color: var(--text-muted);
            border: 1px solid var(--glass-border); border-radius: 8px;
            padding: 6px; font-size: 12px; cursor: pointer; outline: none; -webkit-appearance: none;
        }

        .send-btn {
            background: transparent; border: none; color: var(--text-muted); cursor: pointer;
            padding: 5px; transition: 0.3s;
        }
        .send-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .send-btn:hover { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); }

        /* --- SETTINGS PANEL / MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .settings-card {
            width: 90%; max-width: 480px; padding: 25px; border-radius: 16px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); padding-bottom: 12px;
        }
        .settings-title { font-size: 18px; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: var(--text-main); }

        .settings-section { display: flex; flex-direction: column; gap: 10px; }
        .settings-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        /* Themes Slot Grid */
        .themes-slot-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;
        }
        .theme-card-option {
            padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: var(--glass-hover); cursor: pointer; display: flex; align-items: center;
            gap: 10px; transition: 0.2s; font-size: 12px;
        }
        .theme-card-option:hover, .theme-card-option.active {
            border-color: var(--accent); color: var(--accent);
        }
        .theme-card-preview {
            width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
        }

        @media (max-width: 768px) { 
            #sidebar { position: absolute; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #input-container { width: 92%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar / Navigation -->
    <aside id="sidebar" class="glass">
        <div class="sidebar-header">
            <img src="LEVIANICON.png" id="top-left-logo" alt="Logo">
            <span class="brand-name">LEVIAN</span>
        </div>
        
        <button class="glass-btn primary-btn" onclick="startNewChat()">+ New Chat</button>
        
        <div id="history-list">
            <!-- Dynamic Chat History -->
        </div>

        <div class="sidebar-footer">
            <button class="glass-btn" onclick="openSettings()">⚙️ Settings</button>
            <button class="glass-btn" onclick="exportCurrentChat()">📥 Export Chat Log</button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main id="main-content">
        
        <!-- Landing UI Animation -->
        <div id="landing-ui">
            <h2 id="beta-text">Beta Preview</h2>
            <img src="LEVIANICON.png" id="hero-logo-center" alt="Levian Center">
            <h1 id="hero-text">How can I help you today?</h1>
        </div>

        <div id="chat-stream"></div>

        <!-- Input System -->
        <div id="input-container" class="glass" onclick="focusInput(event)">
            <textarea id="userInput" placeholder="Talk with Levian..." rows="1" oninput="autoResize(this)" onkeydown="handleInput(event)"></textarea>
            <div class="controls">
                <select id="modelSelect">
                    <option value="gemini-3.1-flash-lite">3.1 flash-lite</option>
                    <option value="gemini-3.5-flash" selected>3.5 flash</option>
                    <option value="gemini-2.5-pro">2.5 pro</option>
                </select>
                <button class="send-btn" onclick="sendMessage(event)">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Code2 Style Settings Modal Panel -->
    <div id="settings-modal" class="modal-overlay" onclick="closeSettingsOuter(event)">
        <div class="settings-card glass" onclick="event.stopPropagation()">
            <div class="settings-header">
                <span class="settings-title">Code2 Settings Panel</span>
                <button class="close-modal" onclick="closeSettings()">✕</button>
            </div>

            <!-- Themes Slot -->
            <div class="settings-section">
                <span class="settings-label">THEMES SLOT</span>
                <div class="themes-slot-grid">
                    <div class="theme-card-option" data-t="dark" onclick="selectTheme('dark')">
                        <div class="theme-card-preview" style="background:#00f3ff;"></div> Dark
                    </div>
                    <div class="theme-card-option" data-t="light" onclick="selectTheme('light')">
                        <div class="theme-card-preview" style="background:#0078ff;"></div> Light
                    </div>
                    <div class="theme-card-option" data-t="blue" onclick="selectTheme('blue')">
                        <div class="theme-card-preview" style="background:#38bdf8;"></div> Midnight
                    </div>
                    <div class="theme-card-option" data-t="cyberpunk" onclick="selectTheme('cyberpunk')">
                        <div class="theme-card-preview" style="background:#ff007f;"></div> Cyberpunk
                    </div>
                    <div class="theme-card-option" data-t="matrix" onclick="selectTheme('matrix')">
                        <div class="theme-card-preview" style="background:#00ff66;"></div> Matrix
                    </div>
                    <div class="theme-card-option" data-t="sunset" onclick="selectTheme('sunset')">
                        <div class="theme-card-preview" style="background:#ff9900;"></div> Sunset
                    </div>
                    <div class="theme-card-option" data-t="oled" onclick="selectTheme('oled')">
                        <div class="theme-card-preview" style="background:#ffffff; border:1px solid #777;"></div> OLED
                    </div>
                </div>
            </div>

            <div class="settings-section" style="border-top:1px solid var(--glass-border); padding-top:15px;">
                <span class="settings-label">DATA MANAGEMENT</span>
                <button class="glass-btn" style="color:#ff4444;" onclick="clearAllChats()">Clear All Saved Conversations</button>
            </div>
        </div>
    </div>

    <script>
        /* --- SESSION & PERSISTENCE SYSTEM --- */
        let sessions = JSON.parse(localStorage.getItem('levian_sessions') || '[]');
        let activeSessionId = null;

        const body = document.body;
        const stream = document.getElementById('chat-stream');
        const input = document.getElementById('userInput');
        const historyList = document.getElementById('history-list');

        const systemPrompt = { 
            role: "user", 
            parts: [{ text: "System instruction: You are an AI named Levian. You do not have any other specific personality traits or background descriptions. You only know that your name is Levian." }] 
        };
        const systemAck = { role: "model", parts: [{ text: "Understood." }] };

        function init() {
            // Restore theme preferences
            const savedTheme = localStorage.getItem('levian_theme') || 'dark';
            selectTheme(savedTheme);
            renderHistorySidebar();
            
            // Default: Show Landing Page
            startNewChat();
        }

        function saveStateToStorage() {
            localStorage.setItem('levian_sessions', JSON.stringify(sessions));
        }

        /* --- CHAT CREATION & HANDLING --- */
        function startNewChat() {
            activeSessionId = null;
            stream.innerHTML = '';
            body.classList.remove('chat-active');
            renderHistorySidebar();
        }

        function renderHistorySidebar() {
            historyList.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === activeSessionId ? 'active' : '';
                const item = document.createElement('div');
                item.className = `history-item ${isActive}`;
                item.innerHTML = `
                    <span onclick="loadSession('${session.id}')" title="${escapeHtml(session.title)}">${escapeHtml(session.title)}</span>
                    <button class="delete-btn" onclick="deleteSession('${session.id}', event)">✕</button>
                `;
                historyList.appendChild(item);
            });
        }

        function loadSession(id) {
            activeSessionId = id;
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            
            stream.innerHTML = '';
            body.classList.add('chat-active');
            
            session.history.forEach(msg => {
                if(msg.role === 'user' && msg.parts[0].text.startsWith("System instruction:")) return;
                if(msg.role === 'model' && msg.parts[0].text === "Understood.") return;

                if (msg.role === 'user') {
                    stream.innerHTML += `
                        <div class="msg-wrapper user-wrapper">
                            <div class="msg user">${formatMarkdown(msg.parts[0].text)}</div>
                        </div>`;
                } else {
                    stream.innerHTML += `
                        <div class="msg-wrapper">
                            <img src="LEVIANICON.png" class="ai-avatar" alt="L">
                            <div class="msg ai">${formatMarkdown(msg.parts[0].text)}</div>
                        </div>`;
                }
            });

            stream.scrollTop = stream.scrollHeight;
            renderHistorySidebar();
        }

        function deleteSession(id, event) {
            event.stopPropagation();
            sessions = sessions.filter(s => s.id !== id);
            saveStateToStorage();
            if (activeSessionId === id) {
                startNewChat();
            } else {
                renderHistorySidebar();
            }
        }

        function clearAllChats() {
            if (confirm("Are you sure you want to delete all saved conversations?")) {
                sessions = [];
                saveStateToStorage();
                startNewChat();
                closeSettings();
            }
        }

        function exportCurrentChat() {
            if (!activeSessionId) {
                alert("Start or open a conversation before exporting.");
                return;
            }
            const session = sessions.find(s => s.id === activeSessionId);
            if (!session) return;

            let txtContent = session.history.map(msg => {
                if (msg.role === 'user' && msg.parts[0].text.startsWith("System instruction:")) return "";
                if (msg.role === 'model' && msg.parts[0].text === "Understood.") return "";
                return `${msg.role === 'user' ? 'User' : 'Levian'}: ${msg.parts[0].text}`;
            }).filter(Boolean).join('\n\n');

            const blob = new Blob([txtContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Levian_${session.title.replace(/[^a-z0-9]/gi, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /* --- BACKGROUND AI TITLING --- */
        async function fetchAutoTitleInBackground(sessionId, userPrompt, aiResponse) {
            try {
                const workerUrl = `https://nova-tech-web.aroush-yt31.workers.dev/levian?model=gemini-3.1-flash-lite`;
                
                const titlePrompt = `what should be the name of this conversation in short term title don't say anything else except the title. Context: User asked "${userPrompt.substring(0,200)}", AI answered "${aiResponse.substring(0,200)}"`;

                const res = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: titlePrompt }] }]
                    })
                });

                const data = await res.json();
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    let generatedTitle = data.candidates[0].content.parts[0].text.trim();
                    // Sanitize quotes or newlines
                    generatedTitle = generatedTitle.replace(/^["']|["']$/g, '').replace(/\n/g, ' ');

                    const sessionObj = sessions.find(s => s.id === sessionId);
                    if (sessionObj) {
                        sessionObj.title = generatedTitle;
                        saveStateToStorage();
                        renderHistorySidebar();
                    }
                }
            } catch (err) {
                console.warn("Background titling failed:", err);
            }
        }

        /* --- API & MESSAGING --- */
        async function sendMessage(e) {
            if(e) e.stopPropagation(); 
            
            const text = input.value.trim();
            if (!text) return;

            let isFirstMessageInNewChat = false;

            // Only create session object IF this is the first message sent
            if (activeSessionId === null) {
                isFirstMessageInNewChat = true;
                const newId = Date.now().toString();
                const newSession = {
                    id: newId,
                    title: text.substring(0, 25) + (text.length > 25 ? "..." : ""),
                    history: [systemPrompt, systemAck]
                };
                sessions.unshift(newSession);
                activeSessionId = newId;
                saveStateToStorage();
            }

            if (!body.classList.contains('chat-active')) {
                body.classList.add('chat-active');
            }

            const currentSession = sessions.find(s => s.id === activeSessionId);

            // Render User Message
            stream.innerHTML += `
                <div class="msg-wrapper user-wrapper">
                    <div class="msg user">${formatMarkdown(text)}</div>
                </div>`;
                
            input.value = '';
            input.style.height = 'auto';
            stream.scrollTop = stream.scrollHeight;

            currentSession.history.push({ role: "user", parts: [{ text: text }] });
            saveStateToStorage();
            renderHistorySidebar();

            // Prepare AI Bubble
            const aiMsgId = "ai-msg-" + Date.now();
            const aiAvatarId = "ai-avatar-" + Date.now();
            const requestSessionId = activeSessionId; 
            
            stream.innerHTML += `
                <div class="msg-wrapper">
                    <img src="LEVIANICON.png" id="${aiAvatarId}" class="ai-avatar thinking" alt="L">
                    <div class="msg ai" id="${aiMsgId}"></div>
                </div>`;
                
            stream.scrollTop = stream.scrollHeight;

            try {
                const selectedModel = document.getElementById('modelSelect').value;
                const workerUrl = `https://nova-tech-web.aroush-yt31.workers.dev/levian?model=${selectedModel}`;
                
                const res = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: currentSession.history }) 
                });

                const data = await res.json();
                let aiResponse = "";
                let validPayload = false;
                
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    aiResponse = data.candidates[0].content.parts[0].text;
                    validPayload = true;
                } else if (data.error) {
                    aiResponse = `API Error: ${data.error.message || JSON.stringify(data.error)}`;
                } else {
                    aiResponse = `Unknown API response format.`;
                }
                
                if (activeSessionId === requestSessionId) {
                    document.getElementById(aiAvatarId).classList.remove('thinking');
                    const targetElement = document.getElementById(aiMsgId);
                    runFastTypewriter(targetElement, aiResponse, requestSessionId);
                }
                
                if (validPayload) {
                    currentSession.history.push({ role: "model", parts: [{ text: aiResponse }] });
                    saveStateToStorage();

                    // If this was the first exchange, trigger private AI background titling
                    if (isFirstMessageInNewChat) {
                        fetchAutoTitleInBackground(requestSessionId, text, aiResponse);
                    }
                }

            } catch (err) {
                if (activeSessionId === requestSessionId) {
                    document.getElementById(aiAvatarId).classList.remove('thinking');
                    document.getElementById(aiMsgId).innerHTML = `<span style="color:#ff4444;">Network Core Failure: ${err.message}</span>`;
                }
            }
        }

        /* --- SETTINGS & THEMES --- */
        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
        }
        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }
        function closeSettingsOuter(e) {
            if (e.target.id === 'settings-modal') closeSettings();
        }

        function selectTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('levian_theme', themeName);
            
            document.querySelectorAll('.theme-card-option').forEach(card => {
                if(card.getAttribute('data-t') === themeName) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        /* --- HELPERS & TYPEWRITER --- */
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function handleInput(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(e);
            }
        }

        function focusInput(e) {
            if (e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                input.focus();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatMarkdown(str) {
            let clean = escapeHtml(str);
            clean = clean.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            clean = clean.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            return clean.replace(/\n/g, '<br>');
        }

        function runFastTypewriter(targetElement, fullRawText, sessionIdCheck) {
            let i = 0;
            targetElement.innerHTML = '<span class="text-payload"></span><span class="typing-cursor">|</span>';
            const payloadContainer = targetElement.querySelector('.text-payload');
            const cursorBlock = targetElement.querySelector('.typing-cursor');
            
            const speed = 4;       
            const frameStep = 5; 
            
            const printClock = setInterval(() => {
                if (activeSessionId !== sessionIdCheck) {
                    clearInterval(printClock);
                    return;
                }

                i += frameStep;
                const slice = fullRawText.slice(0, i);
                payloadContainer.innerHTML = formatMarkdown(slice);
                
                const userDistanceFromBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight;
                if (userDistanceFromBottom < 280) {
                    stream.scrollTop = stream.scrollHeight;
                }
                
                if (i >= fullRawText.length) {
                    clearInterval(printClock);
                    if(cursorBlock) cursorBlock.remove(); 
                }
            }, speed);
        }

        init();
    </script>
</body>
</html>
