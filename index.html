<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levian AI</title>
    <style>
        /* ==========================================================================
           1. GLASS UI VARIABLES & THEMING
           ========================================================================== */
        :root {
            /* Dark Mode Defaults */
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6; /* Default Blue */
        }

        [data-theme="light"] {
            /* Light Mode Defaults */
            --bg-color: #f9fafb;
            --sidebar-bg: #ffffff;
            --text-color: #1f2937;
            --glass-bg: rgba(0, 0, 0, 0.05);
            --glass-hover: rgba(0, 0, 0, 0.1);
            --border-color: rgba(0, 0, 0, 0.1);
            --accent-color: #2563eb;
        }

        /* ==========================================================================
           2. BASE RESETS & LAYOUT
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* ==========================================================================
           3. SIDEBAR STYLING
           ========================================================================== */
        #sidebar {
            width: 260px;
            height: 100%;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: var(--glass-hover);
        }

        .history-item.active {
            background: var(--glass-hover);
            border-color: var(--border-color);
            font-weight: bold;
        }

        .history-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .history-del-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.6;
            padding: 0 4px;
        }

        .history-del-btn:hover {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Glass Buttons */
        .glass-btn {
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .glass-btn:hover {
            background: var(--glass-hover);
        }

        .icon-img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        /* ==========================================================================
           4. MAIN CONTENT & STREAM
           ========================================================================== */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }

        #stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .user-message {
            background: var(--glass-hover);
            align-self: flex-end;
            border: 1px solid var(--border-color);
        }

        .ai-message {
            background: transparent;
            align-self: flex-start;
            max-width: 100%;
            width: 100%;
        }

        /* Code Blocks & Typography */
        .ai-message p { margin-bottom: 8px; }
        .ai-message pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: monospace;
            margin: 10px 0;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--text-color);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ==========================================================================
           5. BOTTOM INPUT BAR
           ========================================================================== */
        #input-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: var(--bg-color);
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            resize: none;
            outline: none;
            min-height: 50px;
            max-height: 150px;
            font-size: 0.95rem;
        }

        select {
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* ==========================================================================
           6. SETTINGS MODAL & 7 ACCENT COLORS
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .setting-input {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            margin-top: 5px;
        }

        /* 7 Color Palette Slots */
        .color-palette {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            border-color: var(--text-color);
            transform: scale(1.1);
        }
    </style>
</head>
<body data-theme="dark">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button class="glass-btn" onclick="startNewChat()">+ New Chat</button>
        </div>

        <div id="chat-history">
            <!-- Dynamic chat history -->
        </div>
        
        <div class="sidebar-footer">
            <!-- Theme Toggle Button -->
            <button class="glass-btn" onclick="toggleTheme()">🌗 Toggle Theme</button>

            <!-- Export Chat Log -->
            <button class="glass-btn" onclick="exportCurrentChat()">📥 Export Chat Log</button>

            <!-- Settings Button -->
            <button class="glass-btn" onclick="openSettings()">
                <img id="settings-icon" class="icon-img" src="settingsw.png" alt="Settings"> 
                Settings
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <div id="stream"></div>
        
        <div id="input-container">
            <!-- Renamed models: 1.5 Sparx & 2.1 Lightning -->
            <select id="modelSelect">
                <option value="gemini-3.1-flash-lite">1.5 Sparx</option>
                <option value="gemini-3.5-flash" selected>2.1 Lightning</option>
            </select>
            
            <textarea id="userInput" placeholder="Message Levian AI..." onkeypress="handleEnter(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <h3 style="margin-bottom: 5px;">Settings</h3>
            
            <!-- 7 Accent Color Themes -->
            <div>
                <label style="font-size: 0.85rem;">Accent Color Theme</label>
                <div class="color-palette" id="colorPalette">
                    <div class="color-swatch" style="background: #3b82f6;" onclick="selectAccentColor('#3b82f6', this)"></div>
                    <div class="color-swatch" style="background: #8b5cf6;" onclick="selectAccentColor('#8b5cf6', this)"></div>
                    <div class="color-swatch" style="background: #ec4899;" onclick="selectAccentColor('#ec4899', this)"></div>
                    <div class="color-swatch" style="background: #ef4444;" onclick="selectAccentColor('#ef4444', this)"></div>
                    <div class="color-swatch" style="background: #f97316;" onclick="selectAccentColor('#f97316', this)"></div>
                    <div class="color-swatch" style="background: #10b981;" onclick="selectAccentColor('#10b981', this)"></div>
                    <div class="color-swatch" style="background: #06b6d4;" onclick="selectAccentColor('#06b6d4', this)"></div>
                </div>
            </div>

            <div>
                <label style="font-size: 0.85rem;">System Instruction</label>
                <input type="text" id="sysPromptInput" class="setting-input" placeholder="e.g. You are a helpful assistant...">
            </div>
            
            <div>
                <label style="font-size: 0.85rem;">Worker URL</label>
                <input type="text" id="workerUrlInput" class="setting-input" value="https://levianai.qzz.io/levian">
            </div>
            
            <button class="glass-btn" style="background: var(--accent-color); color: white; border: none;" onclick="saveSettings()">Save & Close</button>
        </div>
    </div>

    <!-- APPLICATION SCRIPT -->
    <script>
        let workerUrl = "https://levianai.qzz.io/levian";
        let systemPrompt = "";
        let currentAccentColor = "#3b82f6";
        
        const stream = document.getElementById("stream");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const historyContainer = document.getElementById("chat-history");

        let chats = {}; 
        let currentChatId = null;
        let isFirstMessage = true;

        /* --- 1. INITIALIZATION & STORAGE --- */
        function init() {
            // Theme setup
            const savedTheme = localStorage.getItem("levian_theme") || "dark";
            document.body.setAttribute("data-theme", savedTheme);
            updateSettingsIcon(savedTheme === "dark");

            // Accent color setup
            const savedColor = localStorage.getItem("levian_accent_color") || "#3b82f6";
            setAccentColor(savedColor);

            // Worker & System Instruction
            const savedWorker = localStorage.getItem("levian_worker_url");
            if (savedWorker) {
                workerUrl = savedWorker;
                document.getElementById("workerUrlInput").value = savedWorker;
            }
            systemPrompt = localStorage.getItem("levian_sys_prompt") || "";
            document.getElementById("sysPromptInput").value = systemPrompt;

            const storedChats = localStorage.getItem("levian_chats");
            if (storedChats) {
                try { chats = JSON.parse(storedChats); } catch(e) { chats = {}; }
            }

            renderSidebarHistory();

            const chatIds = Object.keys(chats);
            if (chatIds.length > 0) {
                loadChat(chatIds[chatIds.length - 1]);
            } else {
                startNewChat();
            }
        }

        function saveState() {
            localStorage.setItem("levian_chats", JSON.stringify(chats));
        }

        /* --- 2. ACCENT COLOR & THEME LOGIC --- */
        function selectAccentColor(hexColor, swatchEl) {
            currentAccentColor = hexColor;
            setAccentColor(hexColor);
            
            const swatches = document.querySelectorAll(".color-swatch");
            swatches.forEach(s => s.classList.remove("active"));
            if (swatchEl) swatchEl.classList.add("active");
        }

        function setAccentColor(hexColor) {
            currentAccentColor = hexColor;
            document.documentElement.style.setProperty("--accent-color", hexColor);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.body.setAttribute("data-theme", newTheme);
            localStorage.setItem("levian_theme", newTheme);
            updateSettingsIcon(newTheme === "dark");
        }

        function updateSettingsIcon(isDarkMode) {
            const icon = document.getElementById("settings-icon");
            if (isDarkMode) {
                icon.src = "settingsw.png"; // White icon for dark theme
            } else {
                icon.src = "settingsb.png"; // Black icon for light theme
            }
        }

        function openSettings() {
            // Highlight active colorSwatch
            const swatches = document.querySelectorAll(".color-swatch");
            swatches.forEach(s => {
                if (s.style.backgroundColor === currentAccentColor || s.style.background === currentAccentColor) {
                    s.classList.add("active");
                } else {
                    s.classList.remove("active");
                }
            });
            document.getElementById("settingsModal").classList.add("active");
        }

        function saveSettings() {
            workerUrl = document.getElementById("workerUrlInput").value.trim();
            systemPrompt = document.getElementById("sysPromptInput").value.trim();
            
            localStorage.setItem("levian_worker_url", workerUrl);
            localStorage.setItem("levian_sys_prompt", systemPrompt);
            localStorage.setItem("levian_accent_color", currentAccentColor);
            
            document.getElementById("settingsModal").classList.remove("active");
        }

        /* --- 3. CHAT MANAGEMENT --- */
        function startNewChat() {
            currentChatId = "chat_" + Date.now();
            chats[currentChatId] = { title: "New Chat", messages: [] };
            isFirstMessage = true;
            stream.innerHTML = "";
            saveState();
            renderSidebarHistory();
        }

        function loadChat(chatId) {
            if (!chats[chatId]) return;
            currentChatId = chatId;
            isFirstMessage = chats[chatId].messages.length === 0;
            stream.innerHTML = "";

            chats[chatId].messages.forEach(msg => {
                const bubble = appendMessage(msg.text, msg.role === "user" ? "user-message" : "ai-message");
                if (msg.role === "model") {
                    bubble.innerHTML = parseMarkdown(msg.text);
                }
            });

            renderSidebarHistory();
            stream.scrollTop = stream.scrollHeight;
        }

        function deleteChat(e, chatId) {
            e.stopPropagation();
            delete chats[chatId];
            saveState();
            const remaining = Object.keys(chats);
            if (remaining.length > 0) {
                loadChat(remaining[remaining.length - 1]);
            } else {
                startNewChat();
            }
        }

        function renderSidebarHistory() {
            historyContainer.innerHTML = "";
            const keys = Object.keys(chats).reverse();

            keys.forEach(id => {
                const chat = chats[id];
                const item = document.createElement("div");
                item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(id);

                const titleSpan = document.createElement("span");
                titleSpan.className = "history-title";
                titleSpan.innerText = "💬 " + (chat.title || "New Chat");

                const delBtn = document.createElement("button");
                delBtn.className = "history-del-btn";
                delBtn.innerHTML = "&times;";
                delBtn.onclick = (e) => deleteChat(e, id);

                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                historyContainer.appendChild(item);
            });
        }

        function exportCurrentChat() {
            if (!currentChatId || !chats[currentChatId]) return;
            const chatData = chats[currentChatId];
            const blob = new Blob([JSON.stringify(chatData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${chatData.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /* --- 4. MESSAGING & API --- */
        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const selectedModel = document.getElementById("modelSelect").value;

            appendMessage(text, "user-message");
            userInput.value = "";

            chats[currentChatId].messages.push({ role: "user", text: text });
            saveState();

            if (isFirstMessage) {
                generateSidebarTitle(text, selectedModel);
                isFirstMessage = false;
            }

            let apiContents = chats[currentChatId].messages.map(m => ({
                role: m.role,
                parts: [{ text: m.text }]
            }));

            if (systemPrompt) {
                apiContents.unshift({
                    role: "user",
                    parts: [{ text: `[System Instruction: ${systemPrompt}]` }]
                });
            }

            const aiBubble = appendMessage("", "ai-message");
            const cursorBlock = document.createElement("span");
            cursorBlock.className = "cursor";
            aiBubble.appendChild(cursorBlock);

            try {
                const response = await fetch(`${workerUrl}?model=${selectedModel}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: apiContents })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                chats[currentChatId].messages.push({ role: "model", text: aiText });
                saveState();

                // Typing effect with smooth scroll
                typeText(aiBubble, cursorBlock, aiText, 15);

            } catch (err) {
                console.error(err);
                aiBubble.innerText = "Error connecting to AI. Please try again.";
                if (cursorBlock) cursorBlock.remove();
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.innerText = text;
            stream.appendChild(div);
            stream.scrollTop = stream.scrollHeight;
            return div;
        }

        /* --- 5. SMOOTH SCROLL & TYPING LOOP --- */
        function typeText(element, cursorBlock, fullRawText, speed) {
            let i = 0;
            const printClock = setInterval(() => {
                element.innerHTML = parseMarkdown(fullRawText.slice(0, i + 1));
                if (cursorBlock) element.appendChild(cursorBlock);
                i++;

                const userDistanceFromBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight;
                if (userDistanceFromBottom < 280) {
                    stream.scrollTop = stream.scrollHeight;
                }

                if (i >= fullRawText.length) {
                    clearInterval(printClock);
                    if (cursorBlock) cursorBlock.remove();
                    element.innerHTML = parseMarkdown(fullRawText);
                }
            }, speed);
        }

        /* --- 6. BACKGROUND TITLE GENERATION --- */
        async function generateSidebarTitle(firstUserMessage, model) {
            const titlePrompt = `User message: "${firstUserMessage}"\n\nWhat should be the name of this conversation in short term title don't say anything else except the title`;

            try {
                const response = await fetch(`${workerUrl}?model=${model}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: titlePrompt }] }]
                    })
                });

                const data = await response.json();
                let generatedTitle = data.candidates[0].content.parts[0].text;
                generatedTitle = generatedTitle.replace(/^["']|["']$/g, '').replace(/\n/g, ' ').trim();

                if (chats[currentChatId]) {
                    chats[currentChatId].title = generatedTitle;
                    saveState();
                    renderSidebarHistory();
                }
            } catch (error) {
                console.error("Failed to generate title:", error);
            }
        }

        /* --- 7. BASIC MARKDOWN PARSER --- */
        function parseMarkdown(text) {
            if (!text) return "";
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code style="background:var(--glass-hover); padding:2px 4px; border-radius:4px;">$1</code>');
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        init();
    </script>
</body>
</html>
